# Tools and tasks for working on feat-agent: `mise install`, then `mise tasks`.
# Versions are the ones the current release was tested with.

[tools]
claude = "2.1.308"              # runs /feat and its agents
gh = "2.103.3"                  # phase 8 pushes and opens the PR; board tracking
"pypi:specify-cli" = "1.2.1"    # Spec Kit: `specify init` in each project
apm = "0.34.0"                  # installs the package (`apm install`, `mise run test:apm`)
node = "24.22.1"                # npx, for `install.sh deps` (skills CLI)
uv = "0.13.4"                   # backend for the pypi: tools
shellcheck = "0.11.0"           # lints install.sh, the tracker script and tests/tracker
actionlint = "1.7.12"           # lints .github/workflows

[tasks.lint]
description = "shellcheck the shell scripts and their tests, actionlint the workflows, compile the Python test stub, validate the Claude Code plugin"
run = [
  "shellcheck install.sh",
  "shellcheck .apm/skills/feat/scripts/*",
  "shellcheck tests/tracker/run.sh tests/tracker/bin/gh",
  "shellcheck tests/spec-number/run.sh tests/spec-number/bin/gh",
  "actionlint",
  "python3 -m py_compile tests/tracker/fake_github.py",
  "claude plugin validate .",
  "! grep -Eiq 'specifier|planner|tasker|spec\\.md|brief|phase [0-9]|/feat' .apm/skills/feat/references/harness.md",
]

[tasks.check]
description = "Report what's missing to run /feat (pass a project dir to check Spec Kit too)"
run = "./install.sh check"

[tasks."test:apm"]
description = "Install this checkout with APM into a scratch dir for claude, and count what landed"
run = '''
#!/usr/bin/env bash
set -euo pipefail
repo="$PWD"
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
cd "$tmp" && git init -q
apm install "$repo" -t claude >/dev/null
for d in .claude/agents .claude/skills; do
  printf '%-18s %s\n' "$d" "$(ls "$d" | wc -l)"
done
test -f .claude/skills/feat/scripts/tracker.sh
test -f .claude/skills/feat/references/harness.md
test -f .claude/skills/fix/SKILL.md
'''

[tasks."test:tracker"]
description = "Run the board tracker script's offline tests (stub gh, fake GraphQL endpoint)"
run = "bash tests/tracker/run.sh"

[tasks."test:spec-number"]
description = "Run the spec-number script's offline tests (local git remote, stub gh)"
run = "bash tests/spec-number/run.sh"

[tasks."dev:install"]
description = "Symlink the skills and agents into ~/.claude and add the third-party skills (instead of APM)"
run = ["./install.sh", "./install.sh deps"]

[tasks."dev:uninstall"]
description = "Remove the symlinks dev:install created"
run = "./install.sh uninstall"

[tasks.pin]
description = "Pin your user-level APM install of feat-agent to a tag and reinstall"
usage = 'arg "<tag>" help="e.g. v0.2.1"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
sed -i -E "s|^(\s*- pdemagny/feat-agent)(#.*)?$|\1#${usage_tag}|" "$HOME/.apm/apm.yml"
grep -n 'pdemagny/feat-agent' "$HOME/.apm/apm.yml"
cd "$HOME" && GITHUB_TOKEN="$(gh auth token)" apm install -g
'''
