name: feat-agent
version: 0.9.0 # x-release-please-version
description: 'From a feature idea or a bug report to a reviewed PR: /brief writes the brief, /feat runs Spec Kit phases in feat-* subagents sized by model and effort, /fix runs Spec Kit''s bug extension the same way.'
author: Pierre Demagny
license: MIT
repository: https://github.com/pdemagny/feat-agent
homepage: https://github.com/pdemagny/feat-agent
type: hybrid
includes: auto
# The third-party skills the agents load, pinned to an upstream tag.
# Keep in sync with `deps` in install.sh.
dependencies:
  apm:
    - addyosmani/agent-skills/skills/interview-me#0.6.13
    - addyosmani/agent-skills/skills/security-and-hardening#0.6.13
    - addyosmani/agent-skills/skills/performance-optimization#0.6.13
