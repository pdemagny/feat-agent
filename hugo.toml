baseURL = "https://pdemagny.github.io/feat-agent/"
title = "feat-agent"
locale = "en"
disableKinds = ["taxonomy", "term", "RSS"]

# README.md and docs/ are the single source: mounted, never copied.
[module]
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"
  [[module.mounts]]
    source = "README.md"
    target = "content/_index.md"
  [[module.mounts]]
    source = "docs"
    target = "content/docs"
  # Diagrams: docs/*.md link img/<name>.svg, which the image render hook below
  # finds here; the README's <img> tags reach the copy under content/docs.
  [[module.mounts]]
    source = "docs/img"
    target = "assets/img"

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions.passthrough]
  enable = false

[markup.highlight]
  noClasses = false

[params]
  BookTheme = "auto"
  BookSection = "docs"
  BookRepo = "https://github.com/pdemagny/feat-agent"
  BookEditPath = "edit/main"
  BookSearch = true

[markup.goldmark.renderHooks.link]
  useEmbedded = "always"

[markup.goldmark.renderHooks.image]
  useEmbedded = "always"
